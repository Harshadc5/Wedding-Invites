<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitations — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf2e2;
    --gold:#b9892f;
    --gold-light:#d8b25c;
    --maroon:#8a1f3b;
    --maroon-dark:#5f1327;
    --ink:#4a3324;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#e8ddc9;
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:640px;
    background:#fff;
    min-height:100vh;
    box-shadow:0 0 60px rgba(0,0,0,.2);
  }
  header{
    background:var(--maroon-dark);
    color:var(--cream);
    padding:22px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  header .eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--gold-light);text-transform:uppercase;}
  header h1{margin:4px 0 0;font-family:'Cinzel',serif;font-size:22px;font-weight:600;}
  .logout-btn{
    background:transparent;border:1px solid var(--gold-light);color:var(--gold-light);font-family:'Cinzel',serif;
    font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:7px 16px;border-radius:16px;cursor:pointer;
  }

  .lock-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;}
  .lock-screen .eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
  .lock-screen h1{font-family:'Cinzel',serif;font-size:22px;color:var(--maroon);margin:8px 0 24px;}
  .login-field{width:260px;padding:13px 14px;border:1px solid #e0d2b2;border-radius:10px;margin-top:10px;font-size:15px;font-family:inherit;}
  .lock-screen .unlock-btn{
    margin-top:18px;background:var(--maroon);color:#fff;border:none;padding:13px 34px;border-radius:30px;
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  }
  .lock-error{color:var(--maroon);font-size:13px;margin-top:12px;min-height:16px;}
  .dash-content{display:none;}
  .dash-content.open{display:block;}

  main{padding:24px;}
  h3{font-family:'Cinzel',serif;font-size:15px;color:var(--maroon);margin:0 0 10px;letter-spacing:1px;}

  .new-card{
    background:#fbf2e2;border:1px solid #e0d2b2;border-radius:12px;padding:18px;margin-bottom:28px;
  }
  .new-row{display:flex;gap:10px;}
  .new-row > div{flex:1;}
  label{display:block;font-size:12px;color:#8a7a60;margin-top:10px;}
  input{
    width:100%;padding:10px 12px;border:1px solid #e0d2b2;border-radius:8px;font-family:inherit;
    font-size:15px;margin-top:4px;background:#fff;
  }
  .create-btn{
    width:100%;margin-top:14px;background:var(--maroon);color:#fff;border:none;padding:13px;border-radius:24px;
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  }

  .inv-item{
    display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e0d2b2;border-radius:12px;
    padding:14px 16px;margin-bottom:10px;
  }
  .inv-meta{flex:1;min-width:0;}
  .inv-title{font-size:18px;font-weight:600;}
  .inv-sub{font-size:12px;color:#8a7a60;}
  .inv-actions{display:flex;gap:8px;flex-shrink:0;}
  .inv-actions a, .inv-actions button{
    font-family:'Cinzel',serif;font-size:10px;letter-spacing:.5px;text-transform:uppercase;
    padding:8px 10px;border-radius:14px;border:1px solid var(--gold-light);background:#fff;color:var(--maroon);
    cursor:pointer;text-decoration:none;white-space:nowrap;
  }
  .inv-actions .danger{border-color:#c66;color:#b33636;}
  .empty-state{color:#8a7a60;font-size:15px;padding:20px 4px;text-align:center;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:10px 20px;border-radius:30px;font-size:14px;opacity:0;transition:opacity .3s, transform .3s;z-index:200;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="eyebrow">Admin</div>
  <h1>Sign In</h1>
  <input id="emailInput" class="login-field" type="email" placeholder="Email" autocomplete="username">
  <input id="passInput" class="login-field" type="password" placeholder="Password" autocomplete="current-password">
  <button class="unlock-btn" id="loginBtn" type="button">Sign In</button>
  <div class="lock-error" id="lockError"></div>
</div>

<div class="wrap dash-content" id="dashContent">
  <header>
    <div>
      <div class="eyebrow">Admin</div>
      <h1>Your Invitations</h1>
    </div>
    <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
  </header>

  <main>
    <div class="new-card">
      <h3>+ New Invitation</h3>
      <div class="new-row">
        <div>
          <label>Bride's Name</label>
          <input id="newBride" placeholder="e.g. Priya">
        </div>
        <div>
          <label>Groom's Name</label>
          <input id="newGroom" placeholder="e.g. Tanishq">
        </div>
      </div>
      <button class="create-btn" id="createBtn" type="button">Create Invitation</button>
    </div>

    <h3>All Invitations</h3>
    <div id="invList"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { watchAuth, loginAdmin, logoutAdmin, createInvitation, listInvitations, deleteInvitation } from '../firebase-shared.js';

const lockScreen = document.getElementById('lockScreen');
const dashContent = document.getElementById('dashContent');
const lockError = document.getElementById('lockError');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  lockError.textContent = '';
  try{
    await loginAdmin(email, pass);
  }catch(e){
    lockError.textContent = 'Sign-in failed — check your email and password.';
  }
});
document.getElementById('passInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', ()=> logoutAdmin());

function escHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function refreshList(){
  const list = document.getElementById('invList');
  list.innerHTML = '<div class="empty-state">Loading…</div>';
  const invites = await listInvitations();
  if(invites.length === 0){
    list.innerHTML = '<div class="empty-state">No invitations yet — create your first one above.</div>';
    return;
  }
  const origin = window.location.origin;
  list.innerHTML = invites.map(inv => `
    <div class="inv-item">
      <div class="inv-meta">
        <div class="inv-title">${escHtml(inv.brideName)} &amp; ${escHtml(inv.groomName)}</div>
        <div class="inv-sub">${escHtml(inv.weddingDate || '')} · /i/${escHtml(inv.slug)}/</div>
      </div>
      <div class="inv-actions">
        <a href="../i/?slug=${encodeURIComponent(inv.slug)}" target="_blank">View</a>
        <a href="edit/?slug=${encodeURIComponent(inv.slug)}">Edit</a>
        <button type="button" class="copy-btn" data-url="${origin}/i/${encodeURIComponent(inv.slug)}/">Copy Link</button>
        <button type="button" class="danger del-btn" data-slug="${escHtml(inv.slug)}">Delete</button>
      </div>
    </div>
  `).join('');
}

document.getElementById('invList').addEventListener('click', async (e)=>{
  const copyBtn = e.target.closest('.copy-btn');
  const delBtn = e.target.closest('.del-btn');
  if(copyBtn){
    navigator.clipboard.writeText(copyBtn.dataset.url).then(()=> toast('Link copied!'))
      .catch(()=> toast(copyBtn.dataset.url));
  }else if(delBtn){
    if(!confirm('Delete this invitation permanently? This cannot be undone.')) return;
    await deleteInvitation(delBtn.dataset.slug);
    toast('Invitation deleted');
    refreshList();
  }
});

document.getElementById('createBtn').addEventListener('click', async ()=>{
  const bride = document.getElementById('newBride').value.trim();
  const groom = document.getElementById('newGroom').value.trim();
  if(!bride || !groom){ toast('Enter both names first'); return; }
  const slug = await createInvitation(bride, groom);
  document.getElementById('newBride').value = '';
  document.getElementById('newGroom').value = '';
  toast('Created! Opening editor…');
  window.location.href = 'edit/?slug=' + encodeURIComponent(slug);
});

watchAuth((user)=>{
  if(user){
    lockScreen.style.display = 'none';
    dashContent.classList.add('open');
    refreshList();
  }else{
    lockScreen.style.display = 'flex';
    dashContent.classList.remove('open');
  }
});
</script>

</body>
</html>
